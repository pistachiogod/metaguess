<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.4"/>
  <!-- Question mark / guess symbol -->
  <text x="32" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle" opacity="0.3">?</text>
  <!-- "MG" text -->
  <text x="32" y="44" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">MG</text>
  <!-- Subtle scanline effect -->
  <line x1="0" y1="20" x2="64" y2="20" stroke="white" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="white" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="44" x2="64" y2="44" stroke="white" stroke-width="0.3" opacity="0.05"/>
</svg>
